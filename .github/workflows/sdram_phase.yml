# Barrido de las fases de la SDRAM. Hay dos relojes que ajustar (PLL principal):
#   - salida 3, SDRAM_CLK: fija el tiempo de las ordenes y escrituras;
#   - salida 4, clk_sdram_rd: recoge el dato de lectura en el pin.
# Se fija la primera ("write") y se compila un .rbf por cada valor de la
# segunda ("read"). Se lanza a mano: Actions > SDRAM phase sweep > Run workflow.
# Cada .rbf lleva las dos fases en el nombre: Aleste520EX_w4050_r1157.rbf.
#
# El PLL da pasos de unos 289 ps (1/8 del periodo del VCO de 432 MHz); Quartus
# redondea al paso mas cercano. El retraso de lectura tiene que ser menor que
# la fase de escritura (lo exige el multiciclo del .sdc).

name: SDRAM phase sweep

on:
  workflow_dispatch:
    inputs:
      write_phase:
        description: 'Fase de SDRAM_CLK (ordenes y escrituras) en ps'
        required: true
        default: '4050'
      read_phases:
        description: 'Retrasos de captura de las lecturas en ps (JSON)'
        required: true
        default: '[0, 579, 1157, 1736, 2314, 2893]'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(github.event.inputs.read_phases) }}

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Descargar el repositorio con los submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fases ${{ github.event.inputs.write_phase }} / ${{ matrix.phase }} ps
        run: |
          sed -i -E 's/(\.phase_shift3\(")[0-9]+ ps/\1${{ github.event.inputs.write_phase }} ps/' rtl/pll/pll_0002.v
          sed -i -E 's/(\.phase_shift4\(")[0-9]+ ps/\1${{ matrix.phase }} ps/' rtl/pll/pll_0002.v
          grep -n 'phase_shift[34]' rtl/pll/pll_0002.v

      - name: Descargar Quartus 17.0
        run: docker pull raetro/quartus:17.0

      - name: Compilar
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile Aleste520EX

      - name: Detalle de tiempos de la SDRAM
        if: always()
        run: |
          if [ -f output_files/Aleste520EX.sta.rpt ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
              quartus_sta -t tools/rutas_sdram.tcl
          fi

      - name: Resumen de tiempos
        if: always()
        run: |
          STA=output_files/Aleste520EX.sta.rpt
          [ -f "$STA" ] || exit 0
          {
            echo "## Escritura ${{ github.event.inputs.write_phase }} ps, lectura ${{ matrix.phase }} ps"
            echo '```'
            for s in "Setup Summary" "Hold Summary"; do
              echo "== $s"
              sed -n "/; $s/,/^$/p" "$STA" | grep -E '^; (SDRAM_CLK|emu\|pll\|)' | cut -c1-110
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar el resultado
        if: always()
        run: |
          mkdir -p dist
          [ -f output_files/Aleste520EX.rbf ] && cp output_files/Aleste520EX.rbf "dist/Aleste520EX_w${{ github.event.inputs.write_phase }}_r${{ matrix.phase }}.rbf"
          for r in sta fit; do
            [ -f output_files/Aleste520EX.$r.rpt ] && cp output_files/Aleste520EX.$r.rpt "dist/Aleste520EX_w${{ github.event.inputs.write_phase }}_r${{ matrix.phase }}.$r.rpt"
          done
          [ -f output_files/rutas_sdram.txt ] && cp output_files/rutas_sdram.txt "dist/rutas_sdram_w${{ github.event.inputs.write_phase }}_r${{ matrix.phase }}.txt"
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aleste520EX_w${{ github.event.inputs.write_phase }}_r${{ matrix.phase }}
          path: dist/
          retention-days: 30
