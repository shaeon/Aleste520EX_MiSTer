# Barrido de la fase del reloj de la SDRAM (salida 3 del PLL principal).
#
# Compila a la vez un .rbf por cada desfase de la lista, para probarlos en
# distintos modulos de SDRAM y quedarse con el que funcione en todos. Se lanza
# a mano: Actions > SDRAM phase sweep > Run workflow (se puede cambiar la
# lista). Cada .rbf lleva el desfase en el nombre: Aleste520EX_ph3472.rbf.
#
# El desfase de serie es 3472 ps (135 grados a 108 MHz). El PLL da pasos de
# unos 289 ps (1/8 del periodo del VCO de 432 MHz); Quartus redondea al paso
# mas cercano.

name: SDRAM phase sweep

on:
  workflow_dispatch:
    inputs:
      phases:
        description: 'Desfases en ps (JSON)'
        required: true
        default: '[2604, 3183, 3472, 3761, 4050, 4339, 4629]'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(github.event.inputs.phases) }}

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Descargar el repositorio con los submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Poner el desfase ${{ matrix.phase }} ps
        run: |
          sed -i -E 's/(\.phase_shift3\(")[0-9]+ ps/\1${{ matrix.phase }} ps/' rtl/pll/pll_0002.v
          grep -n 'phase_shift3' rtl/pll/pll_0002.v

      - name: Descargar Quartus 17.0
        run: docker pull raetro/quartus:17.0

      - name: Compilar
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
            quartus_sh --flow compile Aleste520EX

      - name: Detalle de tiempos de la SDRAM
        if: always()
        run: |
          if [ -f output_files/Aleste520EX.sta.rpt ]; then
            docker run --rm -v "$GITHUB_WORKSPACE":/build -w /build raetro/quartus:17.0 \
              quartus_sta -t tools/rutas_sdram.tcl
          fi

      - name: Resumen de tiempos
        if: always()
        run: |
          STA=output_files/Aleste520EX.sta.rpt
          [ -f "$STA" ] || exit 0
          {
            echo "## Desfase ${{ matrix.phase }} ps"
            echo '```'
            for s in "Setup Summary" "Hold Summary"; do
              echo "== $s"
              sed -n "/; $s/,/^$/p" "$STA" | grep -E '^; (SDRAM_CLK|emu\|pll\|)' | cut -c1-110
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar el resultado
        if: always()
        run: |
          mkdir -p dist
          [ -f output_files/Aleste520EX.rbf ] && cp output_files/Aleste520EX.rbf "dist/Aleste520EX_ph${{ matrix.phase }}.rbf"
          for r in sta fit; do
            [ -f output_files/Aleste520EX.$r.rpt ] && cp output_files/Aleste520EX.$r.rpt "dist/Aleste520EX_ph${{ matrix.phase }}.$r.rpt"
          done
          [ -f output_files/rutas_sdram.txt ] && cp output_files/rutas_sdram.txt "dist/rutas_sdram_ph${{ matrix.phase }}.txt"
          ls -la dist

      - name: Subir el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aleste520EX_ph${{ matrix.phase }}
          path: dist/
          retention-days: 30
